<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Brooklyn Equine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #2c3e50 0%, #4a69bd 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        
        h1 {
            font-size: 8rem;
            color: white;
            margin-bottom: 1rem;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
        }
        
        .error-message {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 1.5rem;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .btn-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        a.btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: white;
            color: #4a69bd;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        a.btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background-color: #f8f9fa;
        }
        
        .footer {
            margin-top: 3rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p class="error-message">Oops! Page Not Found</p>
        <p>You've ventured too far into Brooklyn's equestrian paradise. This page doesn't exist, but the beauty of our community remains.</p>
        
        <div class="btn-container">
            <a href="/" class="btn">Return Home</a>
            <a href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer" class="btn">Visit Us on Google Maps</a>
        </div>
        
        <p style="margin-top: 2rem; font-size: 0.9rem;">
            Brooklyn Equine — Riding through life, one pony at a time.
        </p>
        
        <div class="footer">
            &copy; <span id="year"></span> Brooklyn Equine | 
            <a href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">Contact Us</a>
        </div>
    </div>
    
    <script>(document.getElementById('year').textContent = new Date().getFullYear());</script>
</body>
</html>
